services:
  mysql:
    image: mysql:8.0.39
    container_name: nukkad-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - nukkad_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - nukkad_net

  minio:
    image: minio/minio:latest
    container_name: nukkad-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-nukkad-dev}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-nukkad-dev-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - nukkad_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - nukkad_net

  minio-init:
    image: minio/mc:latest
    container_name: nukkad-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID:-nukkad-dev} ${AWS_SECRET_ACCESS_KEY:-nukkad-dev-secret} &&
      (mc mb -p local/${S3_BUCKET:-nukkad-uploads} || true) &&
      mc anonymous set download local/${S3_BUCKET:-nukkad-uploads}
      "
    networks:
      - nukkad_net

volumes:
  nukkad_mysql_data:
  nukkad_minio_data:

networks:
  nukkad_net:
    driver: bridge
    name: nukkad_net
