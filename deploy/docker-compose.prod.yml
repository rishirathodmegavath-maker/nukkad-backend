services:
  mysql:
    image: mysql:8.0.39
    container_name: nukkad-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - /srv/nukkad/mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - nukkad_net

  minio:
    image: quay.io/minio/minio:latest
    container_name: nukkad-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - /srv/nukkad/media:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - nukkad_net

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: nukkad-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      (mc mb -p local/${S3_BUCKET} || true) &&
      mc anonymous set download local/${S3_BUCKET}
      "
    networks:
      - nukkad_net

  backend:
    build: ./backend
    container_name: nukkad-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - nukkad_net

  caddy:
    image: caddy:2-alpine
    container_name: nukkad-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /srv/nukkad/Caddyfile:/etc/caddy/Caddyfile
      - /srv/nukkad/frontend-dist:/srv/frontend-dist:ro
      - /srv/nukkad/caddy-data:/data
      - /srv/nukkad/caddy-config:/config
    depends_on:
      - backend
      - minio
    networks:
      - nukkad_net

networks:
  nukkad_net:
    driver: bridge
    name: nukkad_net
