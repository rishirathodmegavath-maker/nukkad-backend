services:
  mysql:
    image: mysql:8.0.39
    container_name: nukkad-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - /srv/nukkad/mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - nukkad_net

  minio:
    image: quay.io/minio/minio:latest
    container_name: nukkad-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - /srv/nukkad/media:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - nukkad_net

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: nukkad-minio-init
    depends_on:
      minio:
        condition: service_healthy
    # 'mc anonymous set download' looks like the right preset for a public-read media bucket, but
    # MinIO's built-in 'download' policy grants s3:ListBucket as well as s3:GetObject -- letting
    # anyone enumerate every stored object key (avatars, startup materials, resources...), not just
    # fetch a key they already know. None of the 4 built-in presets (none/download/upload/public)
    # is "read objects but don't list them", so this writes a custom policy with GetObject only.
    #
    # messages/*, feed/* and startup-materials/* are carved out via NotResource (everything else
    # keeps its existing public-read behavior, unchanged: avatars, covers, logos, resource files,
    # group avatars -- none of those carry a post's or startup's own restricted visibility the way
    # a post attachment or a startup material can). Each is private, reachable only through a
    # short-lived presigned URL the backend generates per-request (see FileStorageService#presignGet
    # / FeedService#resolveAttachmentUrl / StartupService#resolveMaterialUrl), never through a
    # permanent public link the way every other prefix here still works.
    #
    # This container only ever runs once per stack start (it's a one-shot policy-setter, not a
    # long-running service) -- deploy.sh's "backend" case does `docker compose up -d --build backend`
    # only, so a policy change here needs `docker compose up minio-init` run explicitly on the VPS
    # (or a full `docker compose up -d`) to actually take effect; merging this file alone does not.
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      (mc mb -p local/${S3_BUCKET} || true) &&
      printf '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":{\"AWS\":[\"*\"]},\"Action\":[\"s3:GetObject\"],\"NotResource\":[\"arn:aws:s3:::%s/messages/*\",\"arn:aws:s3:::%s/feed/*\",\"arn:aws:s3:::%s/startup-materials/*\"]}]}' ${S3_BUCKET} ${S3_BUCKET} ${S3_BUCKET} > /tmp/anon-policy.json &&
      mc anonymous set-json /tmp/anon-policy.json local/${S3_BUCKET}
      "
    networks:
      - nukkad_net

  backend:
    build: ./backend
    container_name: nukkad-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - nukkad_net

  caddy:
    image: caddy:2-alpine
    container_name: nukkad-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /srv/nukkad/Caddyfile:/etc/caddy/Caddyfile
      - /srv/nukkad/frontend-dist:/srv/frontend-dist:ro
      - /srv/nukkad/caddy-data:/data
      - /srv/nukkad/caddy-config:/config
    depends_on:
      - backend
      - minio
    networks:
      - nukkad_net

networks:
  nukkad_net:
    driver: bridge
    name: nukkad_net
