spring:
  application:
    name: nukkad-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:nukkad}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: ${DB_USERNAME:nukkad_app}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:25}
      minimum-idle: ${DB_POOL_MIN_IDLE:25}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    # This dev database is also used by the newer monorepo checkout (E:\Nukkad_v1), whose own
    # migration history (e.g. V39) isn't part of this older codebase's migration set at all —
    # without this, Flyway refuses to start over that gap once a local migration (V40) exists
    # above it.
    ignore-migration-patterns: "*:missing"
    # V40/V41 were already applied (from a build that predated V39 existing in this classpath),
    # so V39 now has to run after them — safe here since it's pure additive DDL (new columns on
    # users, a new email_verification_tokens table) with zero overlap with what V40/V41 touched.
    out-of-order: true

  servlet:
    multipart:
      # 100MB gives headroom for the admin investor bulk-CSV import (tens of thousands of rows) — the
      # frontend's own MAX_UPLOAD_BYTES (api-client.ts) mirrors this value.
      max-file-size: 100MB
      max-request-size: 100MB

  jackson:
    deserialization:
      # Without this, a decimal JSON literal (e.g. 100.5) bound to a long-typed field (money
      # amounts, minor units) is silently truncated (100) instead of rejected -- found on
      # POST /api/wallet/withdrawals's amountMinorUnits. Disabling it makes any such value a clean
      # 400 (via HttpMessageNotReadableException, already handled) across every long/int field in
      # the app, not just that one endpoint.
      # NOTE: this app is on Spring Boot 4 / Jackson 3 (the `tools.jackson` fork), where this
      # DeserializationFeature was renamed from ACCEPT_FLOATING_POINT_NUMBERS_AS_INT (Jackson 2) to
      # ACCEPT_FLOAT_AS_INT -- the old key name silently fails property binding and crashes the
      # whole app at startup (caught in this same review pass). Verify against whichever Jackson
      # major version is actually on the classpath before ever touching this key again.
      accept-float-as-int: false

  mvc:
    # Without this, a request to a completely unmapped path silently falls through to Spring's
    # default (a plain Whitelabel/servlet-container 404) instead of GlobalExceptionHandler's
    # NoHandlerFoundException handler, so it never gets the app's own ApiResponse JSON envelope.
    throw-exception-if-no-handler-found: true
  web:
    resources:
      # This is a pure REST API with no static assets to serve — required alongside the property
      # above, since the static-resource handler would otherwise intercept an unmapped path first
      # and produce its own 404 before DispatcherServlet ever gets a chance to throw.
      add-mappings: false

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

server:
  port: ${SERVER_PORT:8082}
  # Caddy terminates TLS at the edge and forwards plain HTTP internally, setting X-Forwarded-*
  # headers. Without this, request.isSecure() always reports false behind that proxy, which
  # silently suppresses Spring Security's HSTS header (its writer only fires on secure requests).
  forward-headers-strategy: framework
  # The API's JSON (lists of 20-100 records per request) shrinks roughly tenfold under gzip, and nothing in front of
  # the backend compresses it (Caddy's api. host has no `encode`). Bearer-token API with no cookies, so there is no
  # ambient credential for a compression-length attack to ride on. Small bodies are left alone.
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 1KB
  error:
    include-message: always
    include-binding-errors: never
    include-stacktrace: never

springdoc:
  # Public by default for local/dev convenience. Production sets SPRINGDOC_ENABLED=false so the
  # full endpoint/schema inventory (including every /api/admin/** path and payload shape) isn't
  # browsable by anyone on the internet.
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /swagger-ui.html
    persist-authorization: true
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /v3/api-docs

nukkad:
  auth:
    # Testing-only escape hatch while production has no working SMTP — set to false to skip the
    # verification email/gate entirely. Flip back to true once real SMTP is configured.
    require-email-verification: ${REQUIRE_EMAIL_VERIFICATION:true}
  jwt:
    secret: ${JWT_SECRET}
    access-expiration-seconds: ${JWT_ACCESS_EXPIRATION:900}
    refresh-expiration-seconds: ${JWT_REFRESH_EXPIRATION:604800}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5174}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
  mail:
    from: ${MAIL_FROM:no-reply@buildadda.com}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5174}
    # The admin portal origin, used for admin password-reset email links. MUST be set in production
    # (https://admin.buildadda.com) before any SMTP provider is enabled, or the link points at localhost.
    admin-base-url: ${ADMIN_BASE_URL:http://localhost:5174}
    # Emailed admin "forgot password". OFF by default: with no working SMTP a request would be
    # acknowledged as "sent" while no email leaves the server. Set to true only after SMTP_* works and
    # ADMIN_BASE_URL is correct. Changing the password from inside the admin portal is unaffected.
    admin-password-reset-enabled: ${ADMIN_PASSWORD_RESET_ENABLED:false}
  messaging:
    encryption-key: ${MESSAGE_ENCRYPTION_KEY}
  admin:
    # Optional, one-time bootstrap for the very first Admin account — see .env.example. Leave all
    # three unset in normal operation; the app never falls back to a default admin credential.
    bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:}
    bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:}
    # Only consulted when bootstrap-email already belongs to an existing account without ADMIN —
    # must be explicitly "true" to promote it. Otherwise that account is left untouched.
    bootstrap-allow-promotion: ${ADMIN_BOOTSTRAP_ALLOW_PROMOTION:false}
  storage:
    bucket: ${S3_BUCKET:nukkad-uploads}
    region: ${S3_REGION:us-east-1}
    endpoint-override: ${S3_ENDPOINT_OVERRIDE:http://localhost:9000}
    force-path-style: ${S3_FORCE_PATH_STYLE:true}
    public-base-url: ${S3_PUBLIC_BASE_URL:http://localhost:9000/nukkad-uploads}
  discovery:
    # Scheduled AI grant-discovery pipeline (com.nukkad.grant.discovery) -- see .env.example for
    # what each of these does. Off by default: nothing calls Gemini or touches the Grants table
    # until this is explicitly turned on. Neither cron below is a hard-coded production schedule --
    # both are fully overridable via their env var, with the current values only acting as a
    # sensible off-peak default when unset.
    enabled: ${GRANT_DISCOVERY_ENABLED:false}
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.6-flash}
    max-new-grants-per-run: ${GRANT_DISCOVERY_MAX_NEW_PER_RUN:10}
    governments: ${GRANT_DISCOVERY_GOVERNMENTS:Central Government,Maharashtra,Karnataka,Delhi,Telangana,Gujarat,Tamil Nadu,Uttar Pradesh}
    topics: ${GRANT_DISCOVERY_TOPICS:General startup funding (all sectors),Women-led startups,Technology / Deep-tech / AI,Agritech / Rural enterprise,Manufacturing / MSME}
    cron: ${GRANT_DISCOVERY_CRON:0 17 3 * * *}
    expiry-sweep-cron: ${GRANT_DISCOVERY_EXPIRY_SWEEP_CRON:0 0 4 * * *}

logging:
  level:
    com.nukkad: INFO
    org.hibernate.SQL: WARN

management:
  # Explicit rather than relying on Spring Boot's implicit default (also "health" only), so this
  # stays correct even if that default ever changes. Everything else (env, beans, mappings,
  # configprops, heapdump, threaddump, ...) stays unexposed — Railway only needs /actuator/health.
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      # Email sending is already best-effort (EmailService swallows send failures rather than
      # failing the request) — an unreachable SMTP server shouldn't drag the whole app's health
      # status to DOWN.
      enabled: false
